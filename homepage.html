<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04060c">
<meta name="color-scheme" content="dark">
<title>echora</title>
<style>
@property --h1{syntax:'<number>';inherits:true;initial-value:215}
@property --h2{syntax:'<number>';inherits:true;initial-value:255}
:root{--tx:#eef2f8;--dim:rgba(205,218,240,.56);--faint:rgba(205,218,240,.34);--ch:#e9d9b8;--sf:rgba(188,212,242,.06);--ease:cubic-bezier(.22,1,.36,1);
--serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua","Noto Serif",Georgia,serif;
--sans:system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",sans-serif;transition:--h1 2.4s ease,--h2 2.4s ease}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#04060c;color:var(--tx)}
body{font:400 15px/1.45 var(--sans);letter-spacing:-.005em;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;letter-spacing:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid rgba(188,212,242,.6);outline-offset:3px;border-radius:12px}
svg{display:block}
#bg{position:fixed;inset:0;z-index:-3;background:radial-gradient(120% 90% at 50% 30%,#0a1226,#060914 55%,#030409)}
.light{position:fixed;inset:-25%;z-index:-2;pointer-events:none;animation:drift 24s ease-in-out infinite alternate}
.la{background:radial-gradient(42% 34% at 24% 20%,hsl(var(--h1) 55% 48%/.24),transparent 70%)}
.lb{background:radial-gradient(44% 36% at 80% 58%,hsl(var(--h2) 45% 50%/.18),transparent 70%);animation-duration:31s}
@keyframes drift{to{transform:translate3d(5%,-4%,0) scale(1.1)}}
#dust{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.vig{position:fixed;inset:0;z-index:70;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,transparent 58%,rgba(0,0,0,.45))}
.grain{position:fixed;inset:-20%;z-index:71;pointer-events:none;opacity:.08;mix-blend-mode:overlay;animation:gr .9s steps(1) infinite}
@keyframes gr{0%{transform:translate(0,0)}25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-4%)}75%{transform:translate(-4%,-1%)}}
#veil{position:fixed;inset:0;z-index:80;background:#000;pointer-events:none;transition:opacity 1.8s ease}
.on #veil{opacity:0}
#app{position:fixed;inset:0;max-width:560px;margin:0 auto}
.scr{position:absolute;inset:0;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 18px) 20px calc(env(safe-area-inset-bottom,0px) + 200px);scrollbar-width:none;opacity:0;visibility:hidden;transform:translateY(8px);transition:opacity .45s,transform .7s var(--ease),visibility 0s .45s}
.scr::-webkit-scrollbar{display:none}
.scr.act{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.rise{opacity:0;transform:translateY(12px);filter:blur(6px);transition:opacity 1.1s ease,transform 1.3s var(--ease),filter 1.1s ease;transition-delay:calc(var(--i,0)*130ms + 450ms)}
.on .rise{opacity:1;transform:none;filter:none}
.d{font:italic 400 24px/1.3 var(--serif)}
.s{font:400 15px/1.5 var(--sans);color:var(--dim)}
h3{display:flex;justify-content:space-between;align-items:baseline;font:600 17px/1.2 var(--sans);letter-spacing:-.015em;margin:42px 0 16px}
.sa{padding:8px 0 8px 12px;font:400 13px var(--sans);color:var(--dim)}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:44px}
.brand{font:500 11px var(--sans);letter-spacing:.34em;color:var(--dim)}
.hr{display:flex;align-items:center;gap:2px}
.ic{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:var(--dim);transition:transform .3s var(--ease),color .3s}
.ic svg{width:22px;height:22px}
.ic:hover{color:var(--tx)}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--sf);font:italic 400 17px var(--serif);color:var(--ch);text-align:center}
.big{font:italic 400 clamp(46px,14vw,60px)/1.05 var(--serif);letter-spacing:-.02em;margin:4px 0 10px}
.sp{display:inline-block;margin-left:.3em;vertical-align:top;font:400 .26em var(--serif);color:var(--ch)}
.sb{display:flex;align-items:center;gap:12px;width:100%;height:48px;padding:0 16px;margin-top:28px;border-radius:16px;background:var(--sf);color:var(--dim);font:400 15px var(--sans)}
.sb svg{width:19px;height:19px}
.art{display:block;position:relative;overflow:hidden;background-size:cover;background-position:center;flex:none}
.rail{display:flex;gap:14px;overflow-x:auto;margin:0 -20px;padding:0 20px;scrollbar-width:none;scroll-snap-type:x proximity;scroll-padding:0 20px}
.rail::-webkit-scrollbar{display:none}
.feat{position:relative;display:block;width:100%;aspect-ratio:1/1.02;max-height:420px;margin-top:32px;border-radius:28px;overflow:hidden}
.feat::before{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(3,5,10,.88),transparent 58%)}
.fx{position:absolute;left:22px;right:96px;bottom:22px}
.fx small{display:block;margin-bottom:6px;font:400 13px var(--sans);color:var(--ch)}
.fx b{display:block;font:600 26px/1.12 var(--sans);letter-spacing:-.025em}
.fx i{display:block;margin-top:6px;font:400 14px/1.4 var(--sans);font-style:normal;color:var(--dim)}
.pc,.pp{display:grid;place-items:center;border-radius:50%;background:var(--ch);color:#0a0f1c;transition:transform .3s var(--ease)}
.pc{position:absolute;width:52px;height:52px;right:20px;bottom:20px}
.pc svg{width:20px;height:20px;margin-left:2px}
.pp{width:44px;height:44px}.pp svg{width:18px;height:18px}
.pp:active{transform:scale(.93)}
.cd{flex:0 0 148px;text-align:left;scroll-snap-align:start}
.cd .art{width:148px;height:148px;border-radius:18px;margin-bottom:10px}
.cd b{display:block;font:500 15px/1.3 var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd small{display:block;font:400 13px var(--sans);color:var(--dim)}
.it{display:flex;align-items:center;gap:14px;width:100%;padding:8px 0;border-radius:14px}
.it .art{width:52px;height:52px;border-radius:12px}
.it>span:nth-child(2){flex:1;min-width:0}
.it b{display:block;font:500 15px/1.3 var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it small{display:block;font:400 13px var(--sans);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it.now b{color:var(--ch)}
.it .mo{display:none}
.lib .it{padding:9px 0}.lib .it .art{width:56px;height:56px}
.mk{display:grid;place-items:center;background:var(--sf);color:var(--tx)}
.mk svg{width:24px;height:24px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:20px -20px 12px;padding:0 20px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 16px;border-radius:18px;background:var(--sf);font:500 13.5px var(--sans);color:var(--dim);transition:background .3s,color .3s}
.chip.act{background:var(--tx);color:#06080f}
.ttl{display:flex;justify-content:space-between;align-items:center}
.ttl .d,.ttl2{font:600 30px/1.1 var(--sans);font-style:normal;letter-spacing:-.03em}
.ttl2{margin-top:8px}
#q{width:100%;height:48px;margin-top:20px;padding:0 16px;border:0;border-radius:16px;background:var(--sf);color:var(--tx);font:400 16px var(--sans)}
#q::placeholder{color:var(--dim)}
.moods{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.md{position:relative;display:flex;align-items:flex-end;height:92px;padding:14px 16px;border-radius:18px;overflow:hidden;font:600 16px var(--sans);letter-spacing:-.01em;color:#fff}
.md::before{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(3,5,10,.7),transparent 70%)}
.md{isolation:isolate}
.pf{display:grid;justify-items:center;gap:6px;margin-top:28px;text-align:center}
.pf .av{width:84px;height:84px;font-size:40px}
.pf .d{font-size:32px}
.st{display:flex;justify-content:center;gap:44px;margin:30px 0 22px}
.st div{text-align:center}
.st b{display:block;font:600 24px/1.2 var(--sans);letter-spacing:-.02em}
.st small{font:400 12px var(--sans);color:var(--dim)}
.set{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:56px;font:400 16px var(--sans)}
.set small{font-size:14px;color:var(--dim)}
.note{margin:36px 0 0;text-align:center;font:400 12px/1.7 var(--sans);color:var(--faint)}
#tabs{position:fixed;z-index:30;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);width:min(300px,calc(100% - 40px));height:60px;display:flex;justify-content:space-around;align-items:center;border-radius:30px;background:rgba(16,22,40,.74);-webkit-backdrop-filter:blur(24px) saturate(1.2);backdrop-filter:blur(24px) saturate(1.2);box-shadow:0 16px 40px -10px rgba(0,0,0,.75)}
.tb{position:relative;width:56px;height:56px;display:grid;place-items:center;color:var(--faint);transition:color .35s,transform .3s var(--ease)}
.tb svg{width:24px;height:24px}
.tb span{display:none}
.tb.act{color:var(--tx)}
.tb.act::after{content:"";position:absolute;bottom:7px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--ch)}
.tb:active{transform:scale(.9)}
#mini{position:fixed;z-index:31;left:50%;transform:translate(-50%,16px);opacity:0;pointer-events:none;transition:opacity .5s,transform .7s var(--ease);bottom:calc(env(safe-area-inset-bottom,0px) + 84px);width:calc(100% - 28px);max-width:532px;height:60px;display:flex;align-items:center;gap:12px;padding:8px 10px 8px 8px;border-radius:20px;overflow:hidden;background:rgba(16,22,40,.74);-webkit-backdrop-filter:blur(24px) saturate(1.2);backdrop-filter:blur(24px) saturate(1.2);box-shadow:0 16px 40px -12px rgba(0,0,0,.7)}
body.hasq #mini{opacity:1;pointer-events:auto;transform:translateX(-50%)}
#mini .open{flex:1;display:flex;align-items:center;gap:12px;min-width:0}
#mini .art{width:44px;height:44px;border-radius:11px}
#mini .tx{min-width:0}
#mini b{display:block;font:500 14.5px/1.3 var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini small{font:400 12.5px var(--sans);color:var(--dim)}
#mini .lk{display:none}
#mini .pp{width:40px;height:40px}
#mini .bar{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(255,255,255,.06)}
#mini .bar i{display:block;height:100%;background:var(--ch);transform-origin:left;transform:scaleX(0)}
.lk.on{color:var(--ch)}
#np{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;max-width:560px;margin:0 auto;overflow-y:auto;scrollbar-width:none;padding:calc(env(safe-area-inset-top,0px) + 8px) 24px calc(env(safe-area-inset-bottom,0px) + 28px);background:#05070d;transform:translateY(102%);transition:transform .8s var(--ease);visibility:hidden}
#np::-webkit-scrollbar{display:none}
.np #np{transform:none;visibility:visible}
#npb{position:absolute;left:0;right:0;top:0;height:100%;z-index:-1;pointer-events:none;filter:blur(46px) saturate(1.4) brightness(.5);transform:scale(1.5);-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
.nph{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;text-align:center}
.nph small{display:block;font:400 12px var(--sans);color:var(--dim)}
.nph b{font:500 14px var(--sans)}
#cov{width:min(100%,44vh,372px);aspect-ratio:1;margin:18px auto 28px;border-radius:24px;box-shadow:0 40px 70px -24px #000}
.playing #cov{animation:br 7s ease-in-out infinite alternate}
@keyframes br{to{transform:scale(1.03)}}
.npt{display:flex;justify-content:space-between;align-items:center;gap:12px}
.npt .d{font:600 22px/1.2 var(--sans);font-style:normal;letter-spacing:-.02em}
.npt .s{margin-top:2px}
.npt .ic{color:var(--dim)}.npt .ic.on{color:var(--ch)}
.npt .ic svg{width:24px;height:24px}
#wave{display:block;width:100%;height:56px;margin-top:18px;touch-action:none;cursor:pointer}
.times{display:flex;justify-content:space-between;font:400 12px var(--sans);color:var(--dim);font-variant-numeric:tabular-nums}
.ctl{display:flex;justify-content:space-between;align-items:center;margin:14px 0 30px}
.ctl .ic{color:var(--tx)}.ctl .ic svg{width:26px;height:26px}
.ctl .ic.sm{color:var(--faint)}.ctl .ic.sm svg{width:20px;height:20px}
.ctl .ic.sm.on{color:var(--ch)}
.ctl .pp{width:68px;height:68px}.ctl .pp svg{width:26px;height:26px}
.t2row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.t2{display:flex;gap:22px}
.t2 button{position:relative;height:44px;font:500 15px var(--sans);color:var(--faint);transition:color .3s}
.t2 button.act{color:var(--tx)}
.t2 button.act::after{content:"";position:absolute;left:0;bottom:6px;width:16px;height:2px;border-radius:2px;background:var(--ch)}
#pb{min-height:150px}
.ly p{font:italic 400 21px/1.55 var(--serif);color:rgba(205,218,240,.3);transition:color .6s}
.ly p.on{color:var(--tx)}
.why .d{font-size:21px;line-height:1.45}
.why p.s{margin-top:14px;color:var(--ch)}
.it,.cd,.feat,.md,.chip,.ic{transition:transform .3s var(--ease),background .3s,color .3s}
.it:active,.cd:active,.feat:active,.md:active{transform:scale(.98)}
.ic:active{transform:scale(.92)}
#toast{position:fixed;z-index:60;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 156px);transform:translate(-50%,10px);max-width:86vw;padding:12px 18px;border-radius:99px;background:rgba(16,22,40,.94);font:400 13.5px var(--sans);text-align:center;opacity:0;pointer-events:none;transition:opacity .5s,transform .5s}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){
.rise{transform:none;filter:none;transition:opacity .6s;transition-delay:0s}
.light,.grain,.playing #cov{animation:none!important}
.scr,#np{transition-duration:.01s}#veil{transition-duration:.5s}
}

/* Full-screen cinematic lyrics layer. The homepage and its Audio object stay alive underneath. */
#lyricsShell{position:fixed;inset:0;z-index:100;display:none;overflow:hidden;background:#04060c;isolation:isolate}
#lyricsFrame{display:block;width:100%;height:100%;border:0;background:#04060c}
body.lyrics-open #lyricsShell{display:block}
body.lyrics-open{overscroll-behavior:none}

</style>
</head>
<body>
<div id="bg"></div><div class="light la"></div><div class="light lb"></div><canvas id="dust" aria-hidden="true"></canvas>

<div id="app">
<section class="scr act" id="s-home">
<div class="hd rise" style="--i:0"><p class="brand">ECHORA</p>
<div class="hr"><button class="ic" id="bell" aria-label="Notifications"></button><button class="av" id="av" aria-label="Profile">K</button></div></div>
<p class="s rise" style="--i:1" id="gr"></p>
<h1 class="big rise" style="--i:2"><span id="nm"></span><span class="sp">✦</span></h1>
<p class="s rise" style="--i:3" id="tg"></p>
<button class="sb rise" style="--i:4" data-go="search"><span id="sbi"></span>Search</button>
<div class="rise" style="--i:5" id="ft"></div>
<div class="rise" style="--i:6"><h3>Made for you<button class="sa" data-go="lib">See all</button></h3><div class="rail" id="fy"></div></div>
<div class="rise" style="--i:6"><h3>Recently played</h3><div id="rp"></div></div>
<div class="rise" style="--i:6"><h3>New this week</h3><div class="rail" id="nw"></div></div>
</section>

<section class="scr" id="s-search">
<h2 class="ttl2">Search</h2>
<input id="q" type="search" placeholder="Songs, artists, albums…" aria-label="Search" autocomplete="off">
<div id="sr"></div>
</section>

<section class="scr lib" id="s-lib">
<div class="ttl"><h2 class="d">Your Library</h2><button class="ic" id="lsb" aria-label="Search library"></button></div>
<div class="chips" id="chips"></div>
<div id="ll"></div>
</section>

<section class="scr" id="s-me">
<div class="pf"><div class="av">K</div><h2 class="d" id="pn"></h2><p class="s">Listening since today.</p></div>
<div class="st" id="st"></div>
<button class="set" id="rw"><span>Watch the welcome film again</span><small>›</small></button>
<button class="set" data-t="Sleep timer is a placeholder for now."><span>Sleep timer</span><small>Off</small></button>
<button class="set" data-t="Audio quality is a placeholder for now."><span>Audio quality</span><small>High</small></button>
<button class="set" data-t="Nothing new. Someone is still writing them."><span>Notes from someone</span><small>0 new</small></button>
<p class="note">Everything here is placeholder.<br>Swap in your own music in the LIBRARY at the top of the script.</p>
</section>
</div>

<div id="mini"><button class="open" id="mo" aria-label="Open player"><span class="art" id="mArt"></span><span class="tx"><b id="mT"></b><small id="mA"></small></span></button>
<button class="ic lk" id="mLk" aria-label="Like"></button><button class="pp" id="mPp" aria-label="Play"></button><div class="bar"><i id="mBar"></i></div></div>

<nav id="tabs" aria-label="Main"></nav>

<div id="np" role="dialog" aria-label="Now playing"><div id="npb"></div>
<div class="nph"><button class="ic" id="npx" aria-label="Close player"></button><div><small>Playing from</small><b id="src"></b></div><button class="ic" id="npm" aria-label="More"></button></div>
<div id="cov" class="art"></div>
<div class="npt"><div><h2 class="d" id="t"></h2><p class="s" id="a"></p></div><button class="ic lk" id="lk" aria-label="Like"></button></div>
<canvas id="wave" aria-label="Seek bar"></canvas>
<div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
<div class="ctl"><button class="ic sm" id="shuf" aria-label="Shuffle"></button><button class="ic" id="prev" aria-label="Previous"></button><button class="pp" id="pp" aria-label="Play"></button><button class="ic" id="next" aria-label="Next"></button><button class="ic sm" id="rep" aria-label="Repeat"></button></div>
<div class="pnl"><div class="t2row"><div class="t2" id="t2"><button class="act" data-p="lyr">Lyrics</button><button data-p="why">Why it’s here</button><button data-p="que">Up next</button></div><button class="ic" id="lx" aria-label="Full-screen lyrics"></button></div><div id="pb"></div></div>
</div>

<div id="lyricsShell" aria-hidden="true">
  <iframe id="lyricsFrame" title="ECHORA cinematic lyrics" src="lyrics.html?embedded=1" allow="autoplay" loading="eager"></iframe>
</div>

<div id="toast" role="status"></div>
<div class="vig"></div><div class="grain"></div><div id="veil"></div>

<script>
(()=>{
/* ====== YOUR MUSIC GOES HERE ======

   note = the personal "Why it's here" text   lyrics = optional array of lines */
const CONFIG={name:'Kirti',welcomeUrl:'echora_welcome_film.html'};
const LIB={
tracks:[

{id:'t7',title:'Someone Like Weather',artist:'The Lowlights',album:'Night Shift',dur:195,src:'',cover:'',pal:0,scene:2},
{id:'t8',title:'Last Train Out',artist:'North of June',album:'Daylight Savings',dur:259,src:'',cover:'',pal:2,scene:3},
{id:'t9',title:'Window Seat',artist:'Ivo Marlowe',album:'Afterglow',dur:208,src:'',cover:'',pal:1,scene:0},
{id:'t10',title:'Midnight Receipts',artist:'Ivo Marlowe',album:'Afterglow',dur:222,src:'',cover:'',pal:4,scene:3},
{id:'t11',title:'Soft Landing',artist:'Mira Vale',album:'Small Hours',dur:191,src:'',cover:'',pal:3,scene:2},
{id:'t12',title:'Porchlight',artist:'Artist One',album:'First Light',dur:236,src:'',cover:'',pal:2,scene:1},
{id:'t13',title:'Salt and Static',artist:'The Lowlights',album:'Night Shift',dur:184,src:'',cover:'',pal:5,scene:0},
{id:'t14',title:'Everything Is Fine, Mostly',artist:'North of June',album:'Daylight Savings',dur:247,src:'',cover:'',pal:1,scene:2},
{id:'t15',title:'Harbour Lights',artist:'Ivo Marlowe',album:'Afterglow',dur:213,src:'',cover:'',pal:0,scene:1},

for(let i=0;i<=N;i++){const u=i/N,sw=.3+1.3*Math.exp(-(((u-p)/.1)**2));
const y=mid+k*3+wh*.3*amp*sw*(Math.sin(u*31+sd+ts*.002-k*.5)*.6+Math.sin(u*sd*4-ts*.0013)*.4)*Math.sqrt(Math.sin(Math.PI*u));i?P.lineTo(u*ww,y):P.moveTo(u*ww,y)}
wx.globalAlpha=[1,.3,.13][k];wx.lineWidth=1.2;
wx.save();wx.beginPath();wx.rect(0,0,p*ww,wh);wx.clip();wx.strokeStyle='#ecdcbc';wx.stroke(P);wx.restore();
wx.save();wx.beginPath();wx.rect(p*ww,0,ww,wh);wx.clip();wx.strokeStyle='rgba(188,212,242,.5)';wx.stroke(P);wx.restore()}
wx.globalAlpha=1;wx.fillStyle='#ecdcbc';wx.beginPath();wx.arc(p*ww,mid,3.5,0,6.283);wx.fill()}
const COL=['188,212,242','154,140,200','217,194,154'];
const M=Array.from({length:30},()=>({x:Math.random(),y:Math.random(),r:.5+Math.random()*1.4,v:1e-5+Math.random()*3e-5,p:Math.random()*6.3,c:COL[Math.random()<.2?2:Math.random()<.4?1:0]}));
function dust(ts,dt){dx.clearRect(0,0,W,Hh);for(const m of M){if(!RM){m.y-=m.v*dt;if(m.y<-.02){m.y=1.02;m.x=Math.random()}}
dx.fillStyle='rgba('+m.c+','+(.16+.4*(.5+.5*Math.sin(ts*8e-4+m.p))).toFixed(3)+')';dx.beginPath();dx.arc(m.x*W,m.y*Hh,m.r,0,6.283);dx.fill()}}
let lt=0,ls=-1;
function loop(ts){const dt=Math.min(50,ts-lt||16);lt=ts;
if(playing&&sim){simT+=dt/1000;if(simT>=cur().dur)ended()}
if(document.body.classList.contains('np'))wave(ts,dt);dust(ts,dt);
const p=Math.min(1,now()/dur()),sec=Math.floor(now());
if(sec!==ls){ls=sec;$('#cur').textContent=fmt(sec);$('#dur').textContent=fmt(dur());
if(panel==='lyr'){const ps=$$('#pb p'),n=Math.min(ps.length-1,Math.floor(p*ps.length));ps.forEach((e,i)=>e.classList.toggle('on',i===n))}}
$('#mBar').style.transform='scaleX('+p+')';if(lyricsOpen){if(cur().id!=='t1')closeLyrics();else sendLyricsState(false,ts)}requestAnimationFrame(loop)}

home();library();search();load(0,false);go('home');

/* ---------- persistent audio <-> cinematic lyrics bridge ---------- */
let lyricsOpen=false,lyricsFrameLoaded=false,lastLyricsSync=0;
const lyricsFrame=$('#lyricsFrame'),lyricsShell=$('#lyricsShell');
function lyricsState(){
  const t=cur();
  return {type:'ECHORA_SYNC',state:{trackId:t.id,title:t.title,artist:t.artist,album:t.album,time:now(),duration:dur(),playing:!!playing,sim:!!sim,ended:(!playing&&!sim&&A.ended)}};
}
function sendLyricsState(force=false,ts=performance.now()){
  if(!lyricsOpen||!lyricsFrameLoaded||!lyricsFrame.contentWindow)return;
  if(!force&&ts-lastLyricsSync<32)return;
  lastLyricsSync=ts;
  lyricsFrame.contentWindow.postMessage(lyricsState(),'*');
}
function openLyrics(){
  if(cur().id!=='t1'){toast('Cinematic lyrics are currently synced for Earrings.');return;}
  lyricsOpen=true;lyricsFrameLoaded=true;lyricsShell.setAttribute('aria-hidden','false');document.body.classList.add('lyrics-open');
  sendLyricsState(true);
}
function closeLyrics(){
  lyricsOpen=false;lyricsShell.setAttribute('aria-hidden','true');document.body.classList.remove('lyrics-open');
}
lyricsFrame.addEventListener('load',()=>{lyricsFrameLoaded=true;sendLyricsState(true)});
window.addEventListener('message',e=>{
  if(e.source!==lyricsFrame.contentWindow||!e.data||typeof e.data!=='object')return;
  const m=e.data;
  if(m.type==='ECHORA_READY'){lyricsFrameLoaded=true;sendLyricsState(true)}
  else if(m.type==='ECHORA_SEEK'&&Number.isFinite(Number(m.time))){const d=Math.max(.01,dur());seek(Number(m.time)/d);sendLyricsState(true)}
  else if(m.type==='ECHORA_PLAY'){start();sendLyricsState(true)}
  else if(m.type==='ECHORA_PAUSE'){stop();sendLyricsState(true)}
  else if(m.type==='ECHORA_CLOSE'){closeLyrics()}
});

addEventListener('resize',size);size();requestAnimationFrame(loop);
requestAnimationFrame(()=>requestAnimationFrame(()=>document.body.classList.add('on')));
})();
